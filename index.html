<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Valheim Mod Manager</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23f0a04b'/%3E%3Cpath d='M16 5l6 9h-3l5 7h-6v5h-4v-5H8l5-7h-3z' fill='%23161007'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#0e1413;--side:#0b100f;--card:#151d1b;--card2:#1b2523;--line:#24302d;--line2:#374743;--tx:#eee9dc;--mut:#95a39d;--ac:#f0a04b;--ac2:#ffbd75;--on:#1b1005;--ok:#8fc07a;--red:#f07f68;--sky1:#3c2a1c;--sky2:#16201e;--sun:#f0a04b;--h:Constantia,"Sitka Heading",Georgia,serif}
[data-theme=gelo]{--bg:#0d131a;--side:#0a0f15;--card:#141c26;--card2:#1a2532;--line:#233040;--line2:#374a60;--tx:#e8eef4;--mut:#92a3b5;--ac:#8fd0f0;--ac2:#b5e3fa;--on:#06202c;--sky1:#1f3d52;--sky2:#101a25;--sun:#c5ebff}
[data-theme=prato]{--bg:#10140c;--side:#0c1009;--card:#181e12;--card2:#1f2718;--line:#2b3521;--line2:#425033;--tx:#f0efdf;--mut:#a1a98d;--ac:#c9dc6b;--ac2:#dcec8e;--on:#191e05;--sky1:#4a5326;--sky2:#171e10;--sun:#f2eaa0}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;display:grid;grid-template:52px minmax(0,1fr) 34px/224px minmax(0,1fr);overflow:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3,b{font-variant-numeric:lining-nums}h1,h2,h3{font-family:var(--h);font-weight:700;margin:0;text-wrap:balance}
/* barra in alto */
#bar{grid-column:1/-1;background:var(--side);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px;z-index:3}
#bar .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:none;border-radius:7px;padding:6px 13px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--card2)}.btn:disabled{opacity:.45;cursor:default}
.pri{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:600}.pri:hover{background:var(--ac2);border-color:var(--ac2)}
.sq{padding:0;width:34px;height:34px;border-color:transparent}.sq:hover{border-color:var(--line2)}
input[type=text],input[type=search],select{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:7px 11px;min-width:0;height:36px}
select{padding-right:6px}input:hover,select:hover{border-color:var(--line2)}input::placeholder{color:var(--mut)}
.se{position:relative;flex:1;min-width:180px}.se svg{position:absolute;left:11px;top:10px;color:var(--mut)}.se input{width:100%;padding-left:36px}
.prof{display:flex;align-items:center;gap:8px;color:var(--mut)}.prof select{width:186px;color:var(--tx);height:34px;font-weight:600}
/* menu */
aside{background:var(--side);border-right:1px solid var(--line);padding:18px 10px;overflow:auto;display:flex;flex-direction:column}
.logo{display:flex;gap:11px;align-items:center;margin:0 6px 14px}.logo svg{width:38px;height:38px;flex:none}.logo h1{font-size:19px;line-height:1.05}
nav p{margin:14px 10px 4px;font-size:12.5px;color:var(--mut)}
nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:7px;transition:background .15s}
nav button:hover{background:var(--card)}nav button[aria-current=page]{background:var(--ac);color:var(--on);font-weight:600}
nav b{margin-left:auto;background:var(--ac);color:var(--on);border-radius:9px;min-width:20px;padding:0 6px;text-align:center;font-size:12px;font-weight:700}nav [aria-current] b{background:var(--on);color:var(--ac)}
.themes{margin-top:auto;padding:16px 10px 0;display:flex;gap:8px;align-items:center;color:var(--mut);font-size:12.5px}.themes span{margin-right:auto}
.themes button{width:22px;height:22px;border-radius:50%;border:2px solid var(--side);padding:0;box-shadow:0 0 0 1px var(--line2)}.themes button[aria-pressed=true]{box-shadow:0 0 0 2px var(--tx)}
/* barra di stato */
#stat{grid-column:1/-1;background:var(--side);border-top:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 14px;font-size:12.5px;color:var(--mut);overflow:hidden;white-space:nowrap}
#stat .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:7px}#stat .dot.no{background:var(--red)}
#stat button{margin-left:auto;border:0;background:none;display:flex;gap:7px;align-items:center;color:inherit}#stat button:hover{color:var(--tx)}
#prog{position:fixed;top:51px;left:0;right:0;height:2px;overflow:hidden;z-index:5;visibility:hidden}#prog:after{content:"";position:absolute;inset:0 60% 0 0;background:var(--ac);animation:pr 1.1s infinite ease-in-out}body.busy #prog{visibility:visible}body.busy main{pointer-events:none}
@keyframes pr{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
/* contenuto */
main{overflow:auto;padding:26px 30px 40px;scrollbar-color:var(--line2) transparent}
.hd{margin-bottom:18px}.hd h2{font-size:28px;line-height:1.15}.hd p{margin:3px 0 0;color:var(--mut)}
.hd.sp{display:flex;align-items:end;gap:10px;flex-wrap:wrap}.hd.sp>div:first-child{margin-right:auto}
.tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px;align-items:center}.ck{display:flex;gap:7px;align-items:center;color:var(--mut)}.ck input{accent-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(214px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;display:flex;flex-direction:column;position:relative;transition:border-color .18s,transform .18s}
.card:hover{border-color:var(--line2);transform:translateY(-2px)}
.art{height:152px;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--sky1),var(--sky2));display:grid;place-items:center;isolation:isolate}
.art .bl{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);object-fit:cover;filter:blur(20px) brightness(.55) saturate(1.2);z-index:-1}
.art .fg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transition:transform .25s}.card:hover .fg{transform:scale(1.04)}
.art .lt{font:700 58px var(--h);color:var(--ac);opacity:.85}
.off .art,.off .nm,.off .ds{opacity:.45}.off .art{filter:grayscale(.7)}
.tg{position:absolute;left:9px;bottom:9px;display:flex;gap:6px}.tag{background:#0b100fe6;color:var(--tx);border-radius:5px;padding:1px 8px;font-size:12px;font-weight:600}.tag.a{background:var(--ac);color:var(--on)}.tag.r{background:var(--red);color:#2a0904}
.bd{padding:12px 14px 13px;display:flex;flex-direction:column;flex:1;min-width:0}
.nm{border:0;background:none;padding:0;text-align:left;font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.card .nm:after{content:"";position:absolute;inset:0}
.ds{color:var(--mut);font-size:13px}.ds.one{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft{display:flex;align-items:center;gap:6px;margin-top:auto;padding-top:11px}.ft>:first-child{margin-right:auto}.ft button,.ft input,.is button{position:relative;z-index:1}
.met{display:grid;gap:2px;color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}.met span{display:flex;gap:6px;align-items:center}.met svg{width:13px;height:13px}
.is{color:var(--red);font-size:13px;margin-top:6px}.is button{border:0;background:none;padding:0;color:var(--ac);text-decoration:underline;margin-left:6px}
.sw{appearance:none;width:40px;height:22px;border-radius:11px;background:var(--line2);position:relative;margin:0;cursor:pointer;transition:background .15s;flex:none}
.sw:after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:var(--tx);transition:transform .15s}.sw:checked{background:var(--ac)}.sw:checked:after{transform:translateX(18px);background:var(--on)}
/* home */
.hero{position:relative;border-radius:13px;overflow:hidden;min-height:310px;display:flex;align-items:end;isolation:isolate;border:1px solid var(--line);background:linear-gradient(var(--sky2),var(--sky1) 55%,color-mix(in srgb,var(--sun) 42%,var(--sky1)))}
.hero>svg{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,var(--side) 5%,transparent 62%);opacity:.75}
.hero .in{padding:30px 34px;max-width:600px;min-width:0}.hero h2{font-size:40px;line-height:1.08;margin:4px 0 6px;overflow-wrap:anywhere}.hero p{margin:0}.hero .d{color:var(--tx);opacity:.85;margin:0 0 18px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero .pic{width:210px;height:210px;border-radius:14px;margin:0 46px 50px auto;object-fit:cover;box-shadow:0 18px 50px #000a;flex:none}
.nums{display:flex;align-items:center;gap:0;margin:22px 0 6px;flex-wrap:wrap}.nums div{padding:0 30px;border-left:1px solid var(--line2)}.nums div:first-child{padding-left:0;border:0}.nums b{display:block;font:700 30px/1.1 var(--h);font-variant-numeric:lining-nums}.nums span{color:var(--mut)}.nums .btn{margin-left:auto}
.sec{display:flex;align-items:baseline;margin:30px 0 14px}.sec h3{font-size:22px;margin-right:auto}.sec button{border:0;background:none;color:var(--ac)}.sec button:hover{text-decoration:underline}
/* righe */
.row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
.row .ic{width:48px;height:48px;border-radius:7px;object-fit:cover;background:var(--card2);display:grid;place-items:center;font:700 22px var(--h);color:var(--ac)}
.row .nm span,.v{font-weight:400;color:var(--mut);margin-left:8px;font-size:13px}.acs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ok{color:var(--ok);font-size:13px}
.off.row .ic{opacity:.45}
.note{border:1px solid var(--ac);background:var(--card);border-radius:10px;padding:12px 16px;margin-bottom:18px;display:flex;gap:14px;align-items:center;justify-content:space-between}
.empty{color:var(--mut);padding:40px 0;max-width:60ch}
.drop{border:1.5px dashed var(--line2);border-radius:11px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--mut);background:none;min-height:88px;width:100%;margin-top:18px}.drop:hover{border-color:var(--ac);color:var(--tx)}
.drop.big{min-height:210px;flex-direction:column;gap:6px;text-align:center;margin-top:0;font-size:14.5px}.drop.big svg{width:40px;height:40px;color:var(--ac);margin-bottom:6px}.drop.big b{color:var(--tx);font:700 21px var(--h)}body.drag .drop.big{border-color:var(--ac);background:var(--card)}
.cfg{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:24px;padding:14px 2px;border-bottom:1px solid var(--line);align-items:center}.cfg select,.cfg input[type=text]{width:100%}.cfg .sw{justify-self:end}.cfg .nm{white-space:normal}
#upn{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);z-index:8;margin:0;box-shadow:0 8px 30px #0008;width:max-content;max-width:calc(100vw - 40px)}#upn[hidden]{display:none}
.sub{font-size:19px;margin:26px 0 4px}
pre{background:var(--side);border:1px solid var(--line);border-radius:9px;padding:14px;overflow:auto;font:12px/1.5 Consolas,monospace;max-height:56vh;white-space:pre-wrap;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;align-items:start}.pan{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}.pan h3{font-size:20px;margin-bottom:4px}.pan p{margin:0 0 14px;color:var(--mut)}textarea{width:100%;min-height:104px;resize:vertical;background:var(--side);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:11px;font:12px/1.5 Consolas,monospace;overflow-wrap:anywhere;margin-bottom:12px}.warn{color:var(--red)}
/* dettaglio */
.det{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:34px;align-items:start}.det .side{position:sticky;top:0}.det .art{height:270px;border-radius:12px;margin-bottom:16px}
.facts{margin:16px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px}.facts dt{color:var(--mut)}.facts dd{margin:0;text-align:right;overflow-wrap:anywhere}
.side .btn{width:100%;margin-bottom:8px;height:40px}
.md{overflow-wrap:anywhere;max-width:72ch}.md h3{font-size:20px;margin:24px 0 8px}.md p{margin:8px 0}.md ul{padding-left:20px}.md a{color:var(--ac);text-decoration:underline}.md code{background:var(--card2);border-radius:4px;padding:1px 5px;font-size:13px}
#toast{position:fixed;right:20px;bottom:50px;display:grid;gap:8px;max-width:400px;z-index:9}#toast div{background:var(--card2);border:1px solid var(--line2);border-bottom:2px solid var(--ok);border-radius:9px;padding:12px 16px;box-shadow:0 8px 30px #0008}#toast .bad{border-bottom-color:var(--red)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--line2);border-radius:13px;padding:26px;max-width:460px}dialog::backdrop{background:#000b}dialog h2{font-size:22px}dialog p{margin:8px 0 20px;white-space:pre-line;color:var(--mut)}dialog .acs{justify-content:flex-end}
#drop{position:fixed;inset:12px;border:2px dashed var(--ac);border-radius:14px;background:#0b100ff2;display:none;place-items:center;font:700 30px var(--h);z-index:8;pointer-events:none}body.drag #drop{display:grid}
@media(max-width:860px){body{grid-template-columns:60px minmax(0,1fr)}.logo h1,nav span,nav p,.themes span{display:none}nav b{position:absolute;margin:-14px 0 0 14px;min-width:16px;padding:0 4px;font-size:10px}.themes{flex-direction:column;padding:16px 0 0}.logo{margin:0 0 10px;justify-content:center}aside{padding:14px 8px}main{padding:20px 18px}.hero .pic,.prof svg,#vanilla span{display:none}.prof select{width:130px}.det,.cfg{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:48px minmax(0,1fr)}.row .acs{grid-column:2}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:3s!important}.card:hover{transform:none}}
</style></head><body>
<header id="bar"><label class="prof"><svg class="i"><use href="#i-users"/></svg><select id="psel" aria-label="Profilo"></select></label><span class="sp"></span><button class="btn" id="vanilla"><svg class="i"><use href="#i-play"/></svg><span>Gioca senza mod</span></button><button class="btn pri" id="play"></button></header>
<aside><div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="10" fill="var(--ac)"/><path d="M20 6l7 11h-3.4l6 9H22v7h-4v-7h-7.6l6-9H13z" fill="var(--on)"/></svg><h1>Valheim<br>Mod Manager</h1></div><nav id="nav"></nav><div class="themes" id="themes"><span>Tema</span></div></aside>
<main id="main"><p class="empty">Carico…</p></main>
<footer id="stat"></footer><div id="prog"></div>
<div id="upn" class="note" hidden></div><div id="drop">Lascia qui la mod: la installo io</div><div id="toast" role="status"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>

<script>
const T=new URLSearchParams(location.search).get('t'),$=s=>document.querySelector(s),main=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),I=n=>`<svg class="i" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const store={get:(k,d)=>{try{return localStorage.getItem(k)||d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
let S=null,view='home',filter='',show='all',lay=store.get('lay','grid'),B={q:'',sort:'dl',cat:'',page:0,adult:false},cfgFile=null,D=null,busy=0;
const live=window.live=new EventSource('/live?t='+T);live.onmessage=live.onerror=()=>{};
const TH=[['brace','#f0a04b','Brace'],['gelo','#8fd0f0','Gelo'],['prato','#c9dc6b','Prato']];
function theme(t){document.documentElement.dataset.theme=t;store.set('theme',t);$('#themes').innerHTML='<span>Tema</span>'+TH.map(([k,c,n])=>`<button style="background:${c}" data-th="${k}" title="${n}" aria-label="Tema ${n}" aria-pressed="${k==t}"></button>`).join('')}
theme(store.get('theme','brace'));$('#themes').onclick=e=>{const t=e.target.dataset.th;if(t)theme(t)};
function toast(m,bad){const d=document.createElement('div');d.textContent=m;if(bad)d.className='bad';$('#toast').append(d);setTimeout(()=>d.remove(),bad?9000:4500)}
async function api(n,a={}){const r=await fetch('/api/'+n,{method:'POST',headers:{'x-token':T},body:JSON.stringify(a)}).catch(()=>{throw Error('Il mod manager si è chiuso: riavvialo.')});const j=await r.json();if(j&&j.error){if(j.confirm&&!a.confirm)return confirmed(j.error,()=>api(n,{...a,confirm:true}));throw Error(j.error)}return j}

 pkgo:async()=>{K.only=!!$('#only')?.checked;let c;try{c=await api('packLook',{code:K.code})}catch(e){return toast(e.message,1)}const l=c.items.filter(i=>i.auto&&(i.state=='missing'||i.state=='version'));

  run(()=>api('packApply',{code:K.code,only:K.only}),r=>(r.left.length?'Fatto, restano da sistemare: '+r.left.join(', '):'Tutto pronto per giocare insieme')+(r.warnings.length?'. Attenzione: '+r.warnings.join('; '):''))},

// installazione da file: ogni file va al server da solo, così uno sbagliato non blocca gli altri
const RECENT=[];
async function sendFiles(list){if(!list.length)throw Error('Nessun file da installare.');const ok=[],bad=[];
 for(const f of list){let j;try{const r=await fetch('/upload?name='+encodeURIComponent(f.name),{method:'POST',headers:{'x-token':T},body:f});j=await r.json();if(j.confirm&&await ask('Sostituire la mod?',j.error,'Sostituisci'))j=await(await fetch('/upload?confirm=1&name='+encodeURIComponent(f.name),{method:'POST',headers:{'x-token':T},body:f})).json()}catch{j={error:'Il mod manager si è chiuso: riavvialo.'}}
  if(j.error){bad.push(f.name+': '+j.error);RECENT.unshift({file:f.name,error:j.error})}else{ok.push(...j);RECENT.unshift(...j.map(x=>({...x,file:f.name})))}}
 RECENT.splice(20);if(!ok.length)throw Error(bad.join('; '));return{ok,bad}}
function up(get){run(async()=>sendFiles(await get()),r=>done(r.ok)+(r.bad.length?'. Non installate: '+r.bad.join('; '):''))}
// una cartella già estratta diventa uno zip senza compressione, poi si installa come gli altri
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})(),crc32=d=>{let c=0xFFFFFFFF;for(let i=0;i<d.length;i++)c=CRC[(c^d[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
async function zipAs(name,list){list=list.filter(x=>!/(^|\/)(desktop\.ini|thumbs\.db|\.ds_store)$/i.test(x.path));if(!list.length)throw Error('La cartella '+name+' è vuota.');
 const enc=new TextEncoder(),parts=[],cd=[];let off=0;
 for(const{path:p,file}of list){const d=new Uint8Array(await file.arrayBuffer()),n=enc.encode(p),c=crc32(d),h=new DataView(new ArrayBuffer(30)),z=new DataView(new ArrayBuffer(46));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,n.length,true);
  z.setUint32(0,0x02014b50,true);z.setUint16(4,20,true);z.setUint16(6,20,true);z.setUint16(8,0x800,true);z.setUint32(16,c,true);z.setUint32(20,d.length,true);z.setUint32(24,d.length,true);z.setUint16(28,n.length,true);z.setUint32(42,off,true);
  parts.push(h,n,d);cd.push(z,n);off+=30+n.length+d.length}
 const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,list.length,true);e.setUint16(10,list.length,true);e.setUint32(12,cd.reduce((a,x)=>a+x.byteLength,0),true);e.setUint32(16,off,true);
 return new File([...parts,...cd,e],name+'.zip',{type:'application/zip'})}
const entFile=x=>new Promise((ok,no)=>x.file(ok,no));
async function dirZip(root){const out=[];const walk=async(d,p)=>{const r=d.createReader();for(;;){const b=await new Promise((ok,no)=>r.readEntries(ok,no));if(!b.length)break;for(const x of b){const q=p+'/'+x.name;if(x.isDirectory)await walk(x,q);else out.push({path:q,file:await entFile(x)})}}};await walk(root,root.name);return zipAs(root.name,out)}
let dg=0;const isF=e=>e.dataTransfer&&[...e.dataTransfer.types].includes('Files');addEventListener('dragenter',e=>{if(!isF(e))return;e.preventDefault();dg++;document.body.classList.add('drag')});addEventListener('dragleave',e=>{if(isF(e)&&--dg<=0){dg=0;document.body.classList.remove('drag')}});addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();dg=0;document.body.classList.remove('drag');if(!isF(e))return;const fl=[...e.dataTransfer.files],en=[...e.dataTransfer.items].filter(i=>i.kind=='file').map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry());
 if(!en.length||!en.every(Boolean))return up(()=>fl);up(()=>Promise.all(en.map(x=>x.isDirectory?dirZip(x):entFile(x))))});
